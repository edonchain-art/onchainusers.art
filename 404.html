<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<meta name="robots" content="noindex">
<title>Not Found — Onchain Users</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@700;800&family=Kode+Mono:wght@500&family=Tomorrow:wght@400&display=swap">
<style>
  :root{ --bg:#0B0B0E; --panel:#16161A; --border:#2A2A33; --text:#ECEFF0; --muted:#8C8C8C; --accent:#8A7FA3; }
  @media (prefers-color-scheme: light){ :root{ --bg:#FFFFFF; --panel:#F5F6F7; --border:#DADCE0; --text:#3C3C3D; --muted:#6B6B6C; } }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 20px; background:var(--bg); color:var(--text); font-family:'Tomorrow', sans-serif; }
  main{ max-width:520px; }
  .eyebrow{ font-family:'Kode Mono', monospace; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); margin-bottom:22px; }
  h1{ font-family:'Tektur', sans-serif; font-weight:800; font-size:clamp(28px, 6vw, 44px); line-height:1.1; margin:0 0 18px; }
  p{ color:var(--muted); font-size:15px; line-height:1.8; margin:0 0 28px; }
  a.btn{ display:inline-block; font-family:'Kode Mono', monospace; font-size:13px; font-weight:500; color:var(--text); text-decoration:none; background:var(--panel); border:1px solid var(--border); padding:12px 18px; box-shadow:4px 4px 0 var(--border); }
  a.btn:hover{ border-color:var(--accent); }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">Error 404</div>
    <h1>This User<br>went offline.</h1>
    <p>The page you're looking for doesn't exist. Maybe it lost its keys.</p>
    <a class="btn" href="/">Back to Onchain Users</a>
  </main>
</body>
</html>
